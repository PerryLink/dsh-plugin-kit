name: npm-publish

# Reusable publish workflow for the @perrylink dsh plugin ecosystem.
# Called from each plugin repo on tag push; no npm token is needed at all —
# the publish authenticates through npm trusted publishing (GitHub Actions
# OIDC), so the caller only has to grant `id-token: write`.
#
# Caller example (in the plugin repo's .github/workflows/release.yml):
#
#   name: release
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     publish:
#       permissions:
#         contents: read
#         id-token: write
#       uses: PerryLink/dsh-plugin-kit/.github/workflows/npm-publish.yml@master
#       with:
#         package-dir: .

on:
  # `workflow_dispatch` is not a convenience here — it is what makes a trusted
  # publish possible at all in this repo's current configuration. npm binds a
  # trusted publisher to the workflow FILE that performs the OIDC exchange, and
  # when this workflow is only reachable through a caller the request is
  # attributed to the CALLER (`release.yml`), so a binding naming
  # `npm-publish.yml` never matches:
  #   POST 404 .../oidc/token/exchange/package/@perrylink%2fdsh-plugin-kit
  #   OIDC token exchange error - package not found
  # Dispatched directly, this file IS the requesting workflow, so the binding
  # naming `npm-publish.yml` matches. Inputs mirror the workflow_call form.
  workflow_dispatch:
    inputs:
      package-dir:
        description: 'Directory containing the package.json to publish'
        type: string
        default: '.'
        required: false
      build-script:
        description: 'npm/pnpm script that builds the package before publish'
        type: string
        default: 'build'
        required: false
      test-script:
        description: 'npm/pnpm script that tests the package before publish'
        type: string
        default: 'test'
        required: false
      preid:
        description: 'Prerelease id for npm publish --tag (empty = latest)'
        type: string
        default: ''
        required: false
  workflow_call:
    inputs:
      package-dir:
        description: 'Directory containing the package.json to publish'
        type: string
        default: '.'
        required: false
      build-script:
        description: 'npm/pnpm script that builds the package before publish'
        type: string
        default: 'build'
        required: false
      test-script:
        description: 'npm/pnpm script that tests the package before publish'
        type: string
        default: 'test'
        required: false
      preid:
        description: 'Prerelease id for npm publish --tag (empty = latest)'
        type: string
        default: ''
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Declared HERE, not left to the caller. As a reusable workflow this job
    # inherited `id-token: write` from `release.yml`, so a direct dispatch had no
    # OIDC token at all and the run died at "OIDC request TOKEN: MISSING" before
    # the exchange. Declaring it makes the workflow correct in both modes; a
    # caller that grants the same permission is unaffected (it is the same grant,
    # not a wider one).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `registry-url` on purpose: it writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a local
          # .npmrc, and with the secret retired that line is an EMPTY bearer token -
          # the registry then answers 404 on PUT instead of letting npm perform the
          # OIDC trusted-publishing exchange.
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ${{ inputs.package-dir }}
      - name: Test
        run: pnpm run ${{ inputs.test-script }}
        working-directory: ${{ inputs.package-dir }}
      - name: Build
        run: pnpm run ${{ inputs.build-script }}
        working-directory: ${{ inputs.package-dir }}
      # Trusted publishing: the OIDC token replaces the long-lived NPM_TOKEN, so
      # this job reads no secret. npm is upgraded first because the runner ships
      # npm 10.x and the OIDC exchange needs >= 11.5.1.
      - name: Upgrade npm and show what the publish will authenticate with
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi
        working-directory: ${{ inputs.package-dir }}
      - name: Publish
        env:
          # npm's OIDC exchange never throws: a failure is only visible at verbose
          # level, otherwise the step just fails with ENEEDAUTH and no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          if [ -n "${{ inputs.preid }}" ]; then
            npm publish --access public --tag "${{ inputs.preid }}" --provenance
          else
            npm publish --access public --provenance
          fi
        working-directory: ${{ inputs.package-dir }}
